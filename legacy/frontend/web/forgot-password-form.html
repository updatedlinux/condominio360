<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Links Of CSS File -->
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/owl.theme.default.min.css">
    <link rel="stylesheet" href="/assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="/assets/css/flaticon.css">
    <link rel="stylesheet" href="/assets/css/remixicon.css">
    <link rel="stylesheet" href="/assets/css/meanmenu.min.css">
    <link rel="stylesheet" href="/assets/css/animate.min.css">
    <link rel="stylesheet" href="/assets/css/odometer.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/web/assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/web/assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/web/assets/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/web/assets/favicon_io/site.webmanifest">
    <link rel="shortcut icon" href="/web/assets/favicon_io/favicon.ico">
    <!-- Title -->
    <title>Nueva Contraseña - BidiPago</title>
    <style>
        .password-toggle-btn { color: #666; background: none; border: none; cursor: pointer; padding: 4px; }
        .password-toggle-btn:hover { opacity: 0.8; }
        body.dark-mode .password-toggle-btn { color: #fff !important; }
    </style>
</head>

<body>
    <!-- Start Preloader Area -->
    <div class="preloader" id="loader-style">
        <div class="preloader-wrap">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    <!-- End Preloader Area -->

    <!-- Start Navbar Area -->
    <div class="navbar-area">
        <div class="mobile-responsive-nav">
            <div class="container">
                <div class="mobile-responsive-menu">
                    <div class="logo">
                        <a href="/">
                            <img src="/assets/images/logotextdark.svg" alt="BidiPago"
                                style="height: 40px; width: auto;">
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="desktop-nav">
            <div class="container-fluid">
                <nav class="navbar navbar-expand-md navbar-light">
                    <a class="navbar-brand" href="/">
                        <img src="/assets/images/logotextdark.svg" alt="BidiPago" style="height: 75px; width: auto;">
                    </a>
                </nav>
            </div>
        </div>
    </div>
    <!-- End Navbar Area -->

    <!-- Start Page Title Area -->
    <div class="page-title-area bg-2">
        <div class="container">
            <div class="page-title-content">
                <h2>Nueva Contraseña</h2>
            </div>
        </div>
    </div>
    <!-- End Page Title Area -->

    <!-- Start User Area -->
    <div class="user-area ptb-100">
        <div class="container">
            <form class="user-form" id="resetPasswordForm">
                <h3>Cambiar Contraseña</h3>
                <p class="text-center mb-4">Ingresa tu nueva contraseña a continuación.</p>

                <!-- Área para mostrar mensajes de error -->
                <div id="errorAlert" class="alert alert-danger" role="alert" style="display: none;">
                    <span id="errorMessage"></span>
                </div>

                <!-- Área para mostrar mensajes de éxito -->
                <div id="successAlert" class="alert alert-success" role="alert" style="display: none;">
                    <span id="successMessage">Contraseña cambiada exitosamente.</span>
                    <div class="mt-2">
                        <a href="/login" class="btn btn-primary btn-sm">Iniciar Sesión</a>
                    </div>
                </div>

                <div class="row" id="formFields">
                    <div class="col-12">
                        <div class="form-group">
                            <label>Nueva Contraseña</label>
                            <div style="position: relative;">
                                <input class="form-control" type="password" name="password" id="password" required
                                    minlength="8" style="padding-right: 45px;">
                                <button type="button" class="password-toggle-btn" id="passwordToggle" aria-label="Mostrar contraseña"
                                    style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%);">
                                    <i class="ri-eye-off-line" id="passwordToggleIcon" style="font-size: 1.25rem;"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-group">
                            <label>Confirmar Contraseña</label>
                            <div style="position: relative;">
                                <input class="form-control" type="password" name="confirmPassword" id="confirmPassword"
                                    required minlength="8" style="padding-right: 45px;">
                                <button type="button" class="password-toggle-btn" id="confirmPasswordToggle" aria-label="Mostrar contraseña"
                                    style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%);">
                                    <i class="ri-eye-off-line" id="confirmPasswordToggleIcon" style="font-size: 1.25rem;"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <button class="default-btn" type="submit" id="submitBtn">
                            Cambiar Contraseña
                        </button>
                    </div>
                </div>

                <div class="row" id="errorActions" style="display: none;">
                    <div class="col-12 text-center">
                        <a href="/forgot-password" class="default-btn">Solicitar nuevo enlace</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <!-- End User Area -->

    <!-- Start Footer Area -->
    <div class="footer-area pt-100 pb-70 bg-color-0f0e0e">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <div class="single-widget">
                        <div class="footer-logo">
                            <a href="/">
                                <img src="/assets/images/logotextdark.svg" alt="BidiPago"
                                    style="height: 40px; width: auto;">
                            </a>
                        </div>
                        <p>BidiPago - Plataforma P2P de criptomonedas para Latinoamérica</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End Footer Area -->

    <!-- Start CopyRight Area -->
    <div class="copy-right-area bg-color-1e1d1d">
        <div class="container">
            <div class="copy-right-content">
                <p>© 2024 BidiPago - Todos los derechos reservados</p>
            </div>
        </div>
    </div>
    <!-- End CopyRight Area -->

    <!-- Start Go Top Area -->
    <div class="go-top">
        <i class="ri-arrow-up-s-fill"></i>
        <i class="ri-arrow-up-s-fill"></i>
    </div>
    <!-- End Go Top Area -->

    <!-- Links of JS File -->
    <script src="/assets/js/jquery.min.js"></script>
    <script src="/assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/meanmenu.min.js"></script>
    <script src="/assets/js/owl.carousel.min.js"></script>
    <script src="/assets/js/wow.js"></script>
    <script src="/assets/js/appear.min.js"></script>
    <script src="/assets/js/odometer.min.js"></script>
    <script src="/assets/js/form-validator.min.js"></script>
    <script src="/assets/js/contact-form-script.js"></script>
    <script src="/assets/js/custom.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('resetPasswordForm');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const submitBtn = document.getElementById('submitBtn');
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            const successAlert = document.getElementById('successAlert');
            const formFields = document.getElementById('formFields');
            const errorActions = document.getElementById('errorActions');

            // Toggle visibilidad contraseña
            ['password', 'confirmPassword'].forEach(fieldId => {
                const input = document.getElementById(fieldId);
                const toggle = document.getElementById(fieldId + 'Toggle');
                const icon = document.getElementById(fieldId + 'ToggleIcon');
                if (toggle && input && icon) {
                    toggle.addEventListener('click', function () {
                        const isPassword = input.type === 'password';
                        input.type = isPassword ? 'text' : 'password';
                        icon.className = isPassword ? 'ri-eye-line' : 'ri-eye-off-line';
                        toggle.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
                    });
                }
            });

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                showError('Token inválido o faltante.');
                formFields.style.display = 'none';
                errorActions.style.display = 'block';
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                errorAlert.style.display = 'none';
                successAlert.style.display = 'none';

                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (!password || !confirmPassword) {
                    showError('Por favor completa todos los campos');
                    return;
                }

                if (password !== confirmPassword) {
                    showError('Las contraseñas no coinciden');
                    return;
                }

                if (password.length < 8) {
                    showError('La contraseña debe tener al menos 8 caracteres');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Procesando...';

                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token,
                            newPassword: password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        successAlert.style.display = 'block';
                        formFields.style.display = 'none'; // Hide form on success
                    } else {
                        throw new Error(data.message || 'Error al cambiar contraseña');
                    }

                } catch (error) {
                    console.error(error);
                    showError(error.message || 'Error de conexión.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Cambiar Contraseña';
                }
            });

            function showError(msg) {
                errorMessage.textContent = msg;
                errorAlert.style.display = 'block';
            }
        });
    </script>
</body>

</html>
